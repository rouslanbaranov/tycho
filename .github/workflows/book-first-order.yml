name: Align book-first issue dependencies

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/book-first-order.yml'
      - 'scripts/apply_book_first_order.py'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: tycho-book-first-priority
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source boundary
        run: python3 scripts/check_boundary.py
      - name: Reconcile only approved book-first blockers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/apply_book_first_order.py
