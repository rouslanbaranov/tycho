name: Reconcile delivery hierarchy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-delivery-hierarchy.yml'
      - 'scripts/reconcile_issue_plan.py'

permissions:
  contents: read
  issues: write

concurrency:
  group: tycho-issue-plan
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source independence
        run: python3 scripts/check_boundary.py
      - name: Validate issue plan (no writes)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/reconcile_issue_plan.py --dependencies
      - name: Create and verify native links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/reconcile_issue_plan.py --apply --dependencies --delay 1.4
