name: Feature branch convention

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: read

jobs:
  feature-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify branch naming and workload example unit tests
        run: python3 -m unittest discover -s tests -p 'test_tycho17.py' -v
      - name: Validate this PR's source branch against its issue title
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_feature_branch.py
